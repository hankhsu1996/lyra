# The front end's options each design of the benchmark suite is built with, on
# every path, keyed by the design. Each chooses a reading of a text the standard
# does not settle, which Lyra refuses unless asked. The design is built the way
# its author reads it, so what stands behind that text is still reached.
#
# A design that builds without one of its options fails the run until the option
# goes, so this file only shrinks, as the record of how far each design gets
# does.
Vortex:
  - --allow-hierarchical-const
