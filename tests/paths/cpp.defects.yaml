# What the cpp path answers wrongly, one entry per conformance case: the case's id,
# and text the run it produces contains.
#
# A case listed here keeps every check it makes and is expected to fail saying
# this. The day the answer becomes right it passes, which fails the run until
# its entry goes -- which is why a defect is recorded here rather than commented
# out inside the case, where nothing would notice.
#
# A case may appear in this file or in the refusal record, never both.
11_operators/tagged_member_write_in_an_operand_not_taken: "PackedArrayRef"
