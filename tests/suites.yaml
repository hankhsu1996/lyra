suites:
  cpp:
    include_tags: [emit, errors, cpp_run]
    exclude: []
  # The same corpus on the execution backend. A case carries `jit_run` once that
  # backend runs it, and is then held to the expectations it already states; a
  # construct the backend has not reached yet is simply not tagged.
  jit:
    include_tags: [jit_run]
    backend: jit
    exclude: []
