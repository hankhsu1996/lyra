name: Bazel Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
      src_files: ${{ steps.filter.outputs.src_files }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          list-files: shell
          filters: |
            src:
              - 'src/**'
              - 'include/**'
              - 'tests/**'
              - 'examples/**'
              - 'BUILD.bazel'
              - 'MODULE.bazel'
              - '.bazelrc'
              - '.github/workflows/bazel-build.yml'

      - name: Log detected changes
        run: |
          echo "### Change Detection" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ steps.filter.outputs.src }}" == "true" ]]; then
            echo "Source changes detected:" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "${{ steps.filter.outputs.src_files }}" | tr ' ' '\n' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No source changes detected. Build will be skipped." >> $GITHUB_STEP_SUMMARY
          fi

  build:
    name: Build and Test
    needs: changes
    if: ${{ needs.changes.outputs.src == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ hashFiles('MODULE.bazel') }}
          repository-cache: true

      # Both bazel commands run in one job so that they share a server.
      # Analysis lives in that server's memory and no cache carries it between
      # machines, so a second runner repeats the whole of it -- around fifty
      # seconds, far more than either command spends on actions. Sharing it is
      # also what makes the step timings mean what they say: the build step
      # pays for analysis, and the test step then reports what running the
      # tests costs.
      #
      # The remote flags go into the untracked rc layer rather than onto each
      # command line for that same reason: flags that differ between two
      # invocations discard the analysis the first one built, and an rc file
      # cannot drift the way two command lines can.
      - name: Configure remote execution
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [[ -n "$BUILDBUDDY_API_KEY" ]]; then
            echo "build --config=rbe" >> .bazelrc.user
            echo "build --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" >> .bazelrc.user
          fi

      - name: Build
        run: bazel build //...

      - name: Test
        run: |
          bazel test //... \
            --test_tag_filters=-requires-host-cxx \
            --test_output=errors --verbose_failures

  build-status:
    name: Build Status
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check status
        run: |
          if [[ "${{ needs.changes.outputs.src }}" != "true" ]]; then
            echo "No source changes detected, skipping build"
            exit 0
          elif [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Build or tests failed"
            exit 1
          else
            echo "All checks passed"
            exit 0
          fi
