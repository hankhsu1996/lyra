id: emit.dump_ast
tags: [emit]
input:
  command: [dump, ast]
  project: false
  top: Top
  files: [main.sv]
expect:
  exit: 0
  stdout:
    contains:
      - '"kind": "Root"'
      - '"name": "Top"'
      - '"kind": "InstanceBody"'
      - '"name": "byte_value"'
      - '"subroutine": "$countones"'
      - '"definitions"'
