# Where the cpp_host path -- the C++ backend, its program then built by the
# host compiler -- departs from what a design says its size adds beyond where
# the cpp path does, which it departs wherever as well: one entry per growth
# design, the design's name and each kind of thing its larger run left or spent
# otherwise than the design's own file says a step adds, in the words the check
# reports it in. A kind a unit holds in one of its forms is named by the form
# and the kind.
#
# A design is held to exactly what is listed for it. Something new departing
# fails the run, and so does something listed that has stopped, until it goes --
# so this file only ever shrinks, which makes it the record of what a design's
# size still costs on this path that it should not. A time or a peak depends on
# the machine as well, so one listed is owed even on a run that stayed under the
# bound, and only the change fixing that cost takes its line out.
