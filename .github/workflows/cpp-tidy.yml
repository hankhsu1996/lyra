name: C++ Tidy (Nightly)

# clang-tidy re-analyzes every translation unit from scratch, so it does not
# fit the merge-time budget. It runs on its own schedule instead, and reports
# rather than gates: the findings are a backlog to pay down, not a wall in
# front of a merge.
on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  tidy:
    name: Run clang-tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ hashFiles('MODULE.bazel') }}
          repository-cache: true

      - name: Install Clang 20 toolchain
        run: |
          wget -qO /tmp/llvm.key https://apt.llvm.org/llvm-snapshot.gpg.key
          sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/apt.llvm.org.gpg /tmp/llvm.key
          . /etc/lsb-release
          echo "deb http://apt.llvm.org/${DISTRIB_CODENAME}/ llvm-toolchain-${DISTRIB_CODENAME}-20 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-20 clang-tidy-20
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-20 100
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-20 100
          sudo update-alternatives --set clang++ /usr/bin/clang++-20
          sudo update-alternatives --set clang /usr/bin/clang-20

      - name: Build
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          RBE_FLAGS=""
          if [[ -n "$BUILDBUDDY_API_KEY" ]]; then
            RBE_FLAGS="--config=rbe --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
          fi
          bazel build //... $RBE_FLAGS

      - name: Generate compile_commands.json
        run: bazel run //:refresh_compile_commands

      - name: Run clang-tidy
        id: tidy
        run: |
          CPP_FILES=$(find src -name '*.cpp' | tr '\n' ' ')
          set +e
          run-clang-tidy-20 -p . -j "$(nproc)" -quiet \
            -header-filter='^.*(src|include)/lyra/.*' \
            $CPP_FILES > tidy.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Summarize findings
        if: always()
        run: |
          echo "### clang-tidy" >> $GITHUB_STEP_SUMMARY
          TOTAL=$(grep -c 'warning:\|error:' tidy.log || true)
          echo "Total findings: ${TOTAL}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -o '\[[a-z0-9-]*-[a-z0-9-]*\]$' tidy.log | sort | uniq -c | sort -rn >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-log
          path: tidy.log
