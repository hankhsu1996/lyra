name: Host C++ Tests (Nightly)

# The merge gate excludes one target: the C++ path host-compiles the whole
# corpus, once per case, which no per-PR budget holds. What that leaves out is
# the whole of the C++ backend's corpus, so without this job the backend every
# other one is checked against would never run in CI at all. Here it runs on
# its own schedule.
#
# Unlike the nightly clang-tidy sweep, this one gates its own run: a corpus
# case that stops passing is a regression, not a backlog item, so a red nightly
# is the signal to act on.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  host-cxx:
    name: Run host-toolchain tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ hashFiles('MODULE.bazel') }}
          repository-cache: true

      - name: Setup Clang
        uses: ./.github/actions/setup-clang

      # Runs on the runner rather than through `--config=rbe`, which is remote
      # execution: an action sent there runs under the remote image's system
      # GCC, and this target spawns a host C++ compiler of its own. Remote
      # execution would silently test a different toolchain from the one
      # installed above, and the precompiled-header path only engages for clang
      # at all.
      #
      # `nightly` is the exact complement of the default set the merge gate
      # runs, so the two together cover every test target once. Both sets are
      # defined in `.bazelrc`, where the tag they are drawn on is named once.
      - name: Test
        run: |
          bazel test //... --config=nightly --verbose_failures
