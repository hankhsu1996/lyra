name: Pinned Sources

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Check pinned sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check pinned sources
        run: python3 tools/policy/check_pinned_sources.py
