<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>SystemVerilog Conformance Test Suite</title>
    <meta
      name="description"
      content="Each case of a SystemVerilog conformance test suite, run every night on each configuration, and whether each configuration does what IEEE 1800-2023 requires."
    />
    <script>
      // The theme a reader chose is applied before anything is drawn, so a
      // dark page never shows a light one first.
      try {
        var chosen = localStorage.getItem('mantine-color-scheme-value') || 'auto';
        var dark = chosen === 'dark' || (chosen === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-mantine-color-scheme', dark ? 'dark' : 'light');
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
