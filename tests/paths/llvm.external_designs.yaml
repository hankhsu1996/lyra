# How far the llvm path gets with each case of the external design suite, one
# entry per case that does not yet build, run and pass its check: the
# case's name, the step it stops at (`build`, `run` or `check`), and words that
# step says there.
#
# A case is held to exactly what is listed for it. One that stops elsewhere or
# says something else fails the run, and so does one listed that has stopped
# stopping, until its entry says so or goes -- so this file is the record of what
# stands between Lyra and each design, and an entry leaves it only by the design
# getting all the way.
Caliptra:default:hello:
  stops: run
  says: did not end within
HammerBlade:16x8:hello:
  stops: run
  says: did not end within
NVDLA:default:hello:
  stops: run
  says: did not end within
OpenPiton:1x1:hello:
  stops: run
  says: did not end within
OpenTitan:default:hello:
  stops: run
  says: did not end within
uvm-1.2:integrated/ubus/examples:test_2m_4s:
  stops: build
  says: "a concurrent assertion embedded in a procedure is not yet supported"
uvm-1.2:simple/registers/integration/10direct:uvm_reg_mem_built_in_seq:
  stops: check
uvm-1.2:simple/registers/integration/20layered:uvm_reg_mem_built_in_seq:
  stops: check
uvm-1.2:simple/registers/models/broadcast:default:
  stops: check
uvm-1.2:simple/registers/models/coverage:default:
  stops: build
  says: "virtual method 'sample' is 'public' but declared 'protected' in superclass method"
uvm-1.2:simple/registers/primer:hw_reset:
  stops: build
  says: "cannot be assigned to type 'uvm_reg$[]'"
uvm-1.2:simple/registers/primer:reg_user:
  stops: build
  says: "cannot be assigned to type 'uvm_reg$[]'"
uvm-1.2:simple/registers/sequence_api:blk:
  stops: check
