name: Design Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            src:
              - 'src/**'
              - 'include/**'
              - 'tests/**'
              - 'examples/**'
              - 'tools/smoke/**'
              - 'BUILD.bazel'
              - 'MODULE.bazel'
              - '.bazelrc'
              - '.github/workflows/smoke-test.yml'

  smoke:
    name: Smoke Test
    needs: changes
    if: needs.changes.outputs.src == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ hashFiles('MODULE.bazel') }}
          repository-cache: true

      - name: Setup Clang
        uses: ./.github/actions/setup-clang
        with:
          tools: llvm

      - name: Build lyra
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          # This job runs the binary it builds, so the output has to come back.
          # `rbe` leaves outputs remote, which is right for a gate that reads
          # nothing it produces and wrong here.
          RBE_FLAGS=""
          if [[ -n "$BUILDBUDDY_API_KEY" ]]; then
            RBE_FLAGS="--config=rbe --remote_download_toplevel --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
          fi
          bazel build //:lyra $RBE_FLAGS

      - name: Run smoke tests
        run: python3 tools/smoke/run_smoke.py --timeout 60 --memory-mb 2048

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-crash-artifacts
          path: crash-artifacts/
          if-no-files-found: ignore
