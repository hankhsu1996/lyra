name: Conformance Suite on Verilator (Nightly)

# The conformance suite is used against a simulator with nothing of Lyra built
# or present: the runner is built alone and holds the machine's own Verilator
# to a few cases, including the check of the suite's own helper. The runner
# prints a verdict per case and exits non-zero only where it could not hand a
# case to the tool or could not write the run's results, so this asks that the
# suite works standing alone -- finding its cases, its helpers and its
# runfiles -- and not that Verilator conforms.
# The run's results, as JSON, are kept as an artifact of the workflow run.
#
# It runs on a schedule and never on a pull request: how long it takes is
# Verilator's and the host compiler's, which no pull request should wait on.

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  verilator:
    name: Run the Suite on Verilator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ hashFiles('MODULE.bazel') }}
          repository-cache: true

      - name: Install Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      # `dev` runs the actions remotely and brings the program back, since it
      # is run here; a checkout with no key builds it on the runner instead.
      # A case builds and runs in well under a minute here, so one still going
      # after two is one that will not end -- a Verilator that does not stop
      # once no event remains -- and is stopped there.
      - name: Run
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          REMOTE_FLAGS=""
          if [[ -n "$BUILDBUDDY_API_KEY" ]]; then
            REMOTE_FLAGS="--config=dev --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
          fi
          bazel run //conformance/runner:conformance $REMOTE_FLAGS -- \
            --tool verilator --jobs 4 --time-limit 120 \
            --output "$GITHUB_WORKSPACE/conformance-results.json" \
            --suite-revision "$GITHUB_SHA" \
            09_processes/always_comb_combinational_value \
            12_statements/unique_case_reports_when_nothing_matches \
            21_output/dumpvars_records_declarations_and_changes \
            harness/assignment_pattern_recognizes_its_spellings

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-results-verilator
          path: conformance-results.json
          if-no-files-found: warn
