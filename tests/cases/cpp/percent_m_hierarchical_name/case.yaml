      nb=Top.nb
      deeper=Top.nb.deeper
      unnamed=Top.nb
      nb_strobe=Top.nb
      func=Top.func
      loopblk=Top.lp.lbl.body hits=1
      loopblk=Top.lp.lbl.body hits=2
      forblk=Top.lp.fl.fbody
      deep=2
