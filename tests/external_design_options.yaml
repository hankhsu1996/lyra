# The front end's options each design of the benchmark suite is built with, on
# every path, keyed by the design. Each asks for a text Lyra refuses unless
# asked, and the design is built with it the way someone who cannot edit it
# would build it, so what stands behind that text is still reached.
# `docs/ci/README.md` says which texts an option may be listed for.
#
# A design that builds without one of its options fails the run until the option
# goes, so this file only shrinks, as the record of how far each design gets
# does.
BlackParrot:
  - -Wno-error=multiple-always-assigns
Caliptra:
  - -Wno-error=bad-procedural-force
  - -Wno-error=mixed-var-assigns
NVDLA:
  - -Wno-error=duplicate-definition
OpenTitan:
  - --relax-enum-conversions
Vortex:
  - --allow-hierarchical-const
