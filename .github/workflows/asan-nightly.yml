name: Address Sanitizer (Nightly)

# Every pool in the compiler hands out a view into relocatable storage, and an
# id is the only durable handle. A reference kept across an append to the same
# pool therefore reads correctly right up until the storage happens to move --
# so the ordinary gate is green whether or not the code is right, and says
# nothing either way. Review is what stands between that shape and the tree, and
# review has already missed one.
#
# Under the sanitizer a pool moves its storage on every append, so a reference
# held across one is reported on every execution that reads it. What this still
# cannot see is an execution the corpus does not reach.
#
# It runs the merge gate's own set rather than the `nightly` complement, because
# that is the set which exercises the compiler itself -- the pools live in
# lowering, not in the emitted program that the host-compiling group builds.
# `.bazelrc` states the one target of that set it leaves out, and why.
#
# It runs that set twice, once under each compiler that builds Lyra. C++ leaves
# the order a call's arguments and an operator's operands are evaluated in to
# the compiler, and GCC and clang choose opposite ones, so a reference read in
# one operand and invalidated by another is wrong under one of them only.
#
# Like the host C++ nightly and unlike the clang-tidy sweep, this gates its own
# run: a sanitizer report is a defect with a stack trace, not a backlog item.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  asan-gcc:
    name: Run the gate under the address sanitizer, built by GCC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-gcc-${{ hashFiles('MODULE.bazel') }}
          repository-cache: true

      # The remote image's GCC, so only where the key is set. It compiles and
      # runs under that one image, so the sanitizer runtime a test loads is the
      # one its compiler linked against, and instrumenting every dependency
      # costs the runner nothing. A checkout with no key has no GCC build to
      # make, and the job beside this one is the whole of its run.
      - name: Test
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          if [[ -z "$BUILDBUDDY_API_KEY" ]]; then
            echo "::notice::No remote execution key, so nothing here is built by GCC."
            exit 0
          fi
          bazel test //... --config=asan --config=gcc --verbose_failures \
            --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY

  asan-clang:
    name: Run the gate under the address sanitizer, built by clang
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-clang-${{ hashFiles('MODULE.bazel') }}
          repository-cache: true

      # The pinned clang, which links its own sanitizer runtime into each test,
      # under remote execution where the key is set and on the runner otherwise.
      - name: Test
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          RBE_FLAGS=""
          if [[ -n "$BUILDBUDDY_API_KEY" ]]; then
            RBE_FLAGS="--config=rbe --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
          fi
          bazel test //... --config=asan --verbose_failures $RBE_FLAGS
