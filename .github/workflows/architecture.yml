name: Architecture

on:
  pull_request:

jobs:
  check:
    name: Check architecture policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check architecture policy
        run: python3 tools/policy/check_architecture.py

      - name: Check that value emission names no runtime library identifier
        run: python3 tools/policy/check_render_names.py

      - name: Check that every source name the C++ backend writes is mapped
        run: python3 tools/policy/check_emitted_names.py
