# How far the llvm path gets with each design of the benchmark suite, one entry
# per case that does not yet build, run and pass the suite's own check: the
# case's name, the step it stops at (`build`, `run` or `check`), and words that
# step says there.
#
# A case is held to exactly what is listed for it. One that stops elsewhere or
# says something else fails the run, and so does one listed that has stopped
# stopping, until its entry says so or goes -- so this file is the record of what
# stands between Lyra and each design, and an entry leaves it only by the design
# getting all the way.
BlackParrot:1x1:hello:
  stops: build
  says: cannot be written to by any other process
Caliptra:default:hello:
  stops: build
  says: numeric literals must not start with a leading underscore
HammerBlade:16x8:hello:
  stops: build
  says: cannot refer to element
NVDLA:default:hello:
  stops: build
  says: duplicate definition of 'first_stage_of_sync'
OpenPiton:1x1:hello:
  stops: build
  says: cannot select range of
OpenTitan:default:hello:
  stops: build
  says: no implicit conversion from 'logic' to 'mubi4_t'
Vortex:mini:hello:
  stops: build
  says: hierarchical references are not allowed in calls to '$bits'
XuanTie-C910:default:hello:
  stops: build
  says: delay on continuous assignment is not yet supported
