name: C++ Style

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  style:
    name: Check style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Clang
        uses: ./.github/actions/setup-clang
        with:
          tools: clang-format

      - name: Check formatting
        run: |
          find src include tests -name '*.cpp' -o -name '*.hpp' | xargs clang-format --dry-run --Werror

      - name: Check C++ style policy
        run: python3 tools/policy/check_cpp_style.py
