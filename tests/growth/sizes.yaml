# The N each design beside this file is compiled at, by the design's name. It
# is compiled again at twice that, and the two runs are held to each other.
#
# A size is chosen so that the larger run takes long enough to time and stays
# inside what the front end allows a generate loop to count, or a vector to be
# wide, and so that a value whose size follows N is on the same side of what a
# frame keeps in both runs, since one past it is held through a box of a type
# of its own. Neither N nor twice it equals a number the design fixes, such as
# how many bits an element of an array streams as: a unit keeps one constant
# per distinct value, so a coincidence at one size and not the other reads as
# a constant the size added.
