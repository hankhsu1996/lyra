# How far the llvm path gets with each design of the benchmark suite, one entry
# per case that does not yet build, run and pass the suite's own check: the
# case's name, the step it stops at (`build`, `run` or `check`), and words that
# step says there.
#
# A case is held to exactly what is listed for it. One that stops elsewhere or
# says something else fails the run, and so does one listed that has stopped
# stopping, until its entry says so or goes -- so this file is the record of what
# stands between Lyra and each design, and an entry leaves it only by the design
# getting all the way.
