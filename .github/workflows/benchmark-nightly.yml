name: Benchmark (Nightly)

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  benchmark:
    name: Nightly Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.18.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ hashFiles('MODULE.bazel') }}
          repository-cache: true

      - name: Setup Clang
        uses: ./.github/actions/setup-clang
        with:
          tools: llvm

      - name: Setup Verilator
        uses: veryl-lang/setup-verilator@v1

      - name: Log tool versions
        run: |
          echo "## Tool Versions" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          verilator --version >> "$GITHUB_STEP_SUMMARY"
          clang++ --version | head -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Build lyra
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_API_KEY }}
        run: |
          RBE_FLAGS=""
          if [[ -n "$BUILDBUDDY_API_KEY" ]]; then
            RBE_FLAGS="--config=rbe --remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY"
          fi
          bazel build -c opt //:lyra $RBE_FLAGS

      - name: Run benchmarks
        run: |
          set -o pipefail
          python3 tools/bench/run_benchmarks.py --json bench.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: bench.json
          if-no-files-found: ignore
