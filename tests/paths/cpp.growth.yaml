# Where the cpp path departs from what a design says its size adds, one entry
# per growth design: the design's name, and each kind of thing its larger run
# left otherwise than the design's own file says a step adds, in the words the
# check reports it in. A kind a unit holds in one of its forms is named by the
# form and the kind.
#
# A design is held to exactly what is listed for it. Something new departing
# fails the run, and so does something listed that has stopped, until it goes --
# so this file only ever shrinks, which makes it the record of what a design's
# size still costs on this path that it should not.
format_items: [mir.types]
instance_array: [bytes]
listed_operands: [mir.types]
loop_of_children_sized_by_index:
  - mir.class constants
  - mir.classes
  - mir.constructors
  - mir.integral constants
loop_of_clocked_procedures_sized_by_index:
  - mir.callables
  - mir.captures
  - mir.class constants
  - mir.classes
  - mir.closures
  - mir.constructors
  - mir.types
loop_sizing_by_index:
  - mir.callables
  - mir.class constants
  - mir.classes
  - mir.constructors
  - mir.types
record_members_owning_storage: [mir.types]
scan_outputs:
  - mir.types
tagged_union_members: [mir.types]
